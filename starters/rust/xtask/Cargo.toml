[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Zero dependencies, including no `toml` crate: xtask reads Cargo.toml with
# a small hand-rolled reader in main.rs, good enough for our own
# hand-written manifests. See README.md for why.

name: ci

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Everything below is offline: only javac/java from the JDK image.
      - name: build (javac, JPMS graph)
        run: ./build.sh
      - name: test (per-domain, plain-Java runner)
        run: ./test.sh
      - name: boundary-lint (Design D enforcer)
        run: ./tools/boundary-check.sh
      - name: manifest-drift-check
        run: ./tools/generate-manifest.sh --check
